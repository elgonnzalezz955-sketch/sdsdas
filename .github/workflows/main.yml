
name: Build Minecraft Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Minecraft Mod
        run: |
          if [ -f donut-market-tracker/build.gradle ]; then
            cd donut-market-tracker
          fi
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DonutMarketTracker
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar

